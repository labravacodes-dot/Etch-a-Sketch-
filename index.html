<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiina's Training Pad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <!-- The Fine-Art / Composition Training Rig -->
    <div id="etch-a-sketch-body">
      <div id="screen-bezel">
        <div id="sketch-container"></div>
      </div>
      <div id="knob-container">
    
      </div>
    </div>

    <!-- Assistant Evaluation & Tool Panel -->
    <div id="artist-panel">
      <div class="dialogue-box">
        <p><strong>A mysterious figure:</strong> "Ready to get etched?"</p>
      </div>
      <button id="undo-btn" class="control-btn">Undo Stroke</button>
      <button id="clear-btn" class="control-btn">Scrape Canvas</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
